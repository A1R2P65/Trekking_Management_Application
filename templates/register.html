{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-lg rounded-3 p-4">
            <div class="text-center mb-3">
                <i class="bi bi-person-plus-fill text-success display-4"></i>
                <h3 class="fw-bold mt-2">Create Account</h3>
            </div>
            
            {% if error %}
                <div class="alert alert-danger shadow-sm" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label for="role" class="form-label fw-semibold">Register As</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
                        <select class="form-select" id="role" name="role" required>
                            <option value="" disabled selected>Choose role...</option>
                            <option value="trekker">Trekker</option>
                            <option value="trek_staff">Trek Staff</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="email@gmail.com" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="number" class="form-label fw-semibold">Contact Number</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-telephone"></i></span>
                        <input type="text" class="form-control" id="number" name="number" placeholder="+1234567890">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-semibold shadow-sm"><i class="bi bi-check-circle me-1"></i>Sign Up</button>
            </form>
            <div class="text-center mt-3">
                <span class="text-muted">Already have an account?</span>
                <a href="{{ url_for('login') }}" class="ms-1 fw-semibold text-success">Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
