{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card border-0 shadow-lg rounded-3 p-4">
            <div class="text-center mb-3">
                <i class="bi bi-person-circle text-success display-4"></i>
                <h3 class="fw-bold mt-2">Sign In</h3>
            </div>
            
            {% if error %}
                <div class="alert alert-danger shadow-sm" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                        <input type="text" class="form-control" id="email" name="email" placeholder="email@gmail.com" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-semibold shadow-sm"><i class="bi bi-box-arrow-in-right me-1"></i>Sign In</button>
            </form>
            <div class="text-center mt-3">
                <span class="text-muted">Don't have an account?</span>
                <a href="{{ url_for('register') }}" class="ms-1 fw-semibold text-success">Register</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
